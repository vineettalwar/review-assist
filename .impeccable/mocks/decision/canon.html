<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#f8fafc;color:#111827;font-family:Inter,sans-serif}
.p{padding:32px 20px}
.logo{width:44px;height:44px;border-radius:12px;background:#111827;color:#fff;display:grid;place-items:center;font-weight:700;margin:0 auto 18px}
h1{text-align:center;font-size:26px;letter-spacing:-.02em;margin-bottom:8px}
.lede{text-align:center;color:#6b7280;font-size:15px;margin-bottom:26px}
.stars{display:flex;justify-content:center;gap:8px;margin-bottom:22px}
.stars span{font-size:32px;color:#e5e7eb}.stars .on{color:#f59e0b}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;font-size:15px;line-height:1.55;box-shadow:0 2px 8px rgba(17,24,39,.05);min-height:170px;margin-bottom:20px}
.go{height:52px;background:#2563eb;color:#fff;border-radius:12px;display:grid;place-items:center;font-weight:600;margin-bottom:12px}
.sec{height:52px;background:#fff;border:1px solid #e5e7eb;border-radius:12px;display:grid;place-items:center;font-weight:500}
</style></head><body>
<div class="p">
  <div class="logo">L</div>
  <h1>Thanks for visiting, Emily!</h1>
  <p class="lede">We drafted a review from your visit. Edit freely.</p>
  <div class="stars"><span class="on">★</span><span class="on">★</span><span class="on">★</span><span class="on">★</span><span>★</span></div>
  <div class="card">Really good cleaning at Lopez Dental. The staff were friendly and Dr. Lopez explained everything clearly, no rush at all. I'll be back.</div>
  <div class="go">Copy &amp; open Google</div>
  <div class="sec">Post on Trustpilot</div>
</div>
</body></html>
